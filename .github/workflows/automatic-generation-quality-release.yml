name: Automatic generation quality release gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-candidate:
    name: Synthetic evaluator regression (never release certification)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pnpm install --frozen-lockfile
      - name: Install Python workspace
        run: |
          python -m pip install -r backend/requirements.lock
          python -m pip install --no-deps -e backend -e apps/api -e apps/worker
      - name: Require fresh output namespace
        run: |
          test ! -e artifacts
          mkdir artifacts
          install -m 600 \
            evals/fixtures/automatic-generation-quality/synthetic-input-v1.json \
            artifacts/automatic-generation-quality-input.json
      - name: Evaluate, revalidate schema, hash, and scan artifacts
        run: |
          snapshot_sha256="$(sha256sum artifacts/automatic-generation-quality-input.json | cut -d ' ' -f 1)"
          set +e
          pnpm generation:quality:eval \
            --snapshot artifacts/automatic-generation-quality-input.json \
            --profile candidate \
            --expected-snapshot-sha256 "$snapshot_sha256" \
            --json-output artifacts/automatic-generation-quality.json \
            --junit-output artifacts/automatic-generation-quality.junit.xml \
            --markdown-output artifacts/automatic-generation-quality.md
          gate_status=$?
          set -e
          pnpm generation:quality:eval \
            --validate-report artifacts/automatic-generation-quality.json
          pnpm generation:quality:verify-artifacts \
            --json-report artifacts/automatic-generation-quality.json \
            --junit-report artifacts/automatic-generation-quality.junit.xml \
            --markdown-report artifacts/automatic-generation-quality.md \
            --snapshot artifacts/automatic-generation-quality-input.json \
            --expected-snapshot-sha256 "$snapshot_sha256" \
            --manifest-output artifacts/automatic-generation-quality.manifest.json
          test "$gate_status" -eq 0
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/automatic-generation-quality.json").read_text())
          assert report["gate"]["passed"] is True
          assert report["synthetic"] is True
          assert report["certification"] == {
              "liveRunId": None,
              "reasonCodes": ["SYNTHETIC_ONLY"],
              "releaseCertified": False,
              "status": "NOT_CERTIFIED_SYNTHETIC",
          }
          PY
      - name: Preserve synthetic regression evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: automatic-generation-quality-synthetic
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  protected-operational-release:
    name: Reviewed operational golden release certification
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64, generation-quality-release]
    environment: automatic-generation-quality-release
    env:
      APPROVED_SNAPSHOT_PATH: ${{ vars.APPROVED_SNAPSHOT_PATH }}
      APPROVED_SNAPSHOT_SHA256: ${{ secrets.APPROVED_SNAPSHOT_SHA256 }}
      PYTHONPATH: ${{ github.workspace }}/backend/src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Block when no mounted reviewed operational golden exists
        run: |
          test -n "$APPROVED_SNAPSHOT_PATH" || exit 2
          test -n "$APPROVED_SNAPSHOT_SHA256" || exit 2
          case "$APPROVED_SNAPSHOT_SHA256" in (*[!0-9a-f]*|'') exit 2;; esac
          test "${#APPROVED_SNAPSHOT_SHA256}" -eq 64 || exit 2
          test -f "$APPROVED_SNAPSHOT_PATH" || exit 2
          test ! -L "$APPROVED_SNAPSHOT_PATH" || exit 2
          printf '%s  %s\n' "$APPROVED_SNAPSHOT_SHA256" "$APPROVED_SNAPSHOT_PATH" | sha256sum -c - || exit 2
      - name: Require pre-provisioned offline toolchain and fresh outputs
        run: |
          command -v node
          command -v pnpm
          test ! -e artifacts
          mkdir artifacts
          install -m 600 "$APPROVED_SNAPSHOT_PATH" artifacts/approved-operational-golden.json
      - name: Evaluate, revalidate schema, hash, and scan release artifacts
        run: |
          set +e
          pnpm generation:quality:eval \
            --snapshot artifacts/approved-operational-golden.json \
            --profile release \
            --expected-snapshot-sha256 "$APPROVED_SNAPSHOT_SHA256" \
            --json-output artifacts/automatic-generation-quality-release.json \
            --junit-output artifacts/automatic-generation-quality-release.junit.xml \
            --markdown-output artifacts/automatic-generation-quality-release.md
          gate_status=$?
          set -e
          pnpm generation:quality:eval \
            --validate-report artifacts/automatic-generation-quality-release.json
          pnpm generation:quality:verify-artifacts \
            --json-report artifacts/automatic-generation-quality-release.json \
            --junit-report artifacts/automatic-generation-quality-release.junit.xml \
            --markdown-report artifacts/automatic-generation-quality-release.md \
            --snapshot artifacts/approved-operational-golden.json \
            --expected-snapshot-sha256 "$APPROVED_SNAPSHOT_SHA256" \
            --manifest-output artifacts/automatic-generation-quality-release.manifest.json
          test "$gate_status" -eq 0
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/automatic-generation-quality-release.json").read_text())
          assert report["profile"] == "RELEASE"
          assert report["datasetKind"] == "OPERATIONAL_GOLDEN"
          assert report["synthetic"] is False
          assert report["gate"]["passed"] is True
          assert report["certification"]["releaseCertified"] is True
          assert report["certification"]["status"] == "RELEASE_CERTIFIED"
          PY
      - name: Preserve protected release evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: automatic-generation-quality-release
          path: artifacts/
          if-no-files-found: error
          retention-days: 400
