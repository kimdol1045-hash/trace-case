name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, unit, architecture and contract drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pnpm install --frozen-lockfile
      - name: Install Python workspace
        run: |
          python -m pip install -r backend/requirements.lock
          python -m pip install --no-deps -e backend -e apps/api -e apps/worker
      - run: pnpm check
      - run: pnpm --filter @tc/web build

  migration:
    name: PostgreSQL migration and repository tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_USER: tc
          POSTGRES_PASSWORD: tc-test-only
          POSTGRES_DB: tc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tc -d tc_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TC_TEST_DATABASE_URL: postgresql+psycopg://tc:tc-test-only@127.0.0.1:5432/tc_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install Python workspace
        run: |
          python -m pip install -r backend/requirements.lock
          python -m pip install --no-deps -e backend -e apps/api -e apps/worker
      - name: Repository migration and concurrency tests
        run: python -m pytest backend/tests/repository -m postgres
      - name: Sprint 1 PostgreSQL API contract tests
        run: python -m pytest apps/api/tests -m postgres
