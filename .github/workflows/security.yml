name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency, source and public-repository audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install JavaScript workspace
        run: pnpm install --frozen-lockfile
      - name: Audit all JavaScript dependencies
        run: pnpm audit --audit-level low
      - name: Install pinned security tools
        run: python -m pip install pip-audit==2.10.1 bandit==1.9.4
      - name: Audit Python locked dependencies
        run: pip-audit -r backend/requirements.lock
      - name: Scan production Python sources
        run: bandit --severity-level medium --confidence-level medium -r backend/src apps/api/src apps/worker/src
      - name: Reject unapproved public-repository material
        run: pnpm test:security

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        with:
          category: "/language:${{ matrix.language }}"
