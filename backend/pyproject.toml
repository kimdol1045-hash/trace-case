[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tc-backend"
version = "0.1.0"
description = "Backend foundations for the test-case management platform"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg==0.32.0",
  "defusedxml>=0.7,<1",
  "httpx>=0.28,<1",
  "lightrag-hku==1.5.6",
  "pgvector>=0.3,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "SQLAlchemy>=2.0.36,<3",
  "websockets>=16.1,<17",
]

[project.optional-dependencies]
test = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<8",
]

[project.scripts]
tc-backend-check = "tc_backend.startup:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "postgres: requires a disposable PostgreSQL 16+ database with pgvector",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
