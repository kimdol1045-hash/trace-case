name: ${TC_PHASE_F_T09_WAVE8_PROJECT:?generated by the wave-8 harness}

services:
  source-postgres:
    image: ${TC_PHASE_F_T09_WAVE8_SOURCE_IMAGE_ID:?pre-existing pinned pgvector PG16 image id}
    container_name: ${TC_PHASE_F_T09_WAVE8_SOURCE_CONTAINER:?generated by the wave-8 harness}
    environment:
      POSTGRES_DB: ${TC_PHASE_F_T09_WAVE8_SOURCE_DATABASE:?generated by the wave-8 harness}
      POSTGRES_USER: ${TC_PHASE_F_T09_WAVE8_SOURCE_USER:?generated by the wave-8 harness}
      POSTGRES_PASSWORD: ${TC_PHASE_F_T09_WAVE8_SOURCE_PASSWORD:?generated by the wave-8 harness}
    ports:
      - "127.0.0.1:${TC_PHASE_F_T09_WAVE8_SOURCE_PORT:?generated by the wave-8 harness}:5432"
    volumes:
      - source-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 2s
      retries: 45
      start_period: 5s
    labels:
      com.tc.phase-f-rehearsal: ${TC_PHASE_F_T09_WAVE8_PROJECT}
      com.tc.phase-f-task: PF-SF1-T09
      com.tc.phase-f-wave: wave8
      com.tc.role: source-postgres
    networks:
      - rehearsal

  auxiliary-postgres:
    image: ${TC_PHASE_F_T09_WAVE8_AUXILIARY_IMAGE_ID:?pre-existing pinned AGE plus pgvector PG16 image id}
    container_name: ${TC_PHASE_F_T09_WAVE8_AUXILIARY_CONTAINER:?generated by the wave-8 harness}
    environment:
      POSTGRES_DB: ${TC_PHASE_F_T09_WAVE8_AUXILIARY_DATABASE:?generated by the wave-8 harness}
      POSTGRES_USER: ${TC_PHASE_F_T09_WAVE8_AUXILIARY_USER:?generated by the wave-8 harness}
      POSTGRES_PASSWORD: ${TC_PHASE_F_T09_WAVE8_AUXILIARY_PASSWORD:?generated by the wave-8 harness}
    ports:
      - "127.0.0.1:${TC_PHASE_F_T09_WAVE8_AUXILIARY_PORT:?generated by the wave-8 harness}:5432"
    volumes:
      - auxiliary-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 2s
      retries: 45
      start_period: 5s
    stop_grace_period: 1s
    labels:
      com.tc.phase-f-rehearsal: ${TC_PHASE_F_T09_WAVE8_PROJECT}
      com.tc.phase-f-task: PF-SF1-T09
      com.tc.phase-f-wave: wave8
      com.tc.role: auxiliary-postgres
    networks:
      - rehearsal

volumes:
  source-data:
    name: ${TC_PHASE_F_T09_WAVE8_SOURCE_VOLUME:?generated by the wave-8 harness}
    labels:
      com.tc.phase-f-rehearsal: ${TC_PHASE_F_T09_WAVE8_PROJECT}
      com.tc.phase-f-task: PF-SF1-T09
      com.tc.phase-f-wave: wave8
  auxiliary-data:
    name: ${TC_PHASE_F_T09_WAVE8_AUXILIARY_VOLUME:?generated by the wave-8 harness}
    labels:
      com.tc.phase-f-rehearsal: ${TC_PHASE_F_T09_WAVE8_PROJECT}
      com.tc.phase-f-task: PF-SF1-T09
      com.tc.phase-f-wave: wave8

networks:
  rehearsal:
    name: ${TC_PHASE_F_T09_WAVE8_NETWORK:?generated by the wave-8 harness}
    labels:
      com.tc.phase-f-rehearsal: ${TC_PHASE_F_T09_WAVE8_PROJECT}
      com.tc.phase-f-task: PF-SF1-T09
      com.tc.phase-f-wave: wave8
