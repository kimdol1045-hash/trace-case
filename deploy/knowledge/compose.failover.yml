name: tc-lightrag-failover-rehearsal

services:
  authoritative-postgres:
    image: pgvector/pgvector:0.8.1-pg16@sha256:33198da2828a14c30348d2ccb4750833d5ed9a44c88d840a0e523d7417120337
    container_name: tc-lightrag-failover-authoritative-postgres
    environment:
      POSTGRES_DB: tc_lightrag_authoritative_test
      POSTGRES_USER: tc_rehearsal
      POSTGRES_PASSWORD: ${TC_LIGHTRAG_REHEARSAL_AUTHORITATIVE_PASSWORD:?generated by the rehearsal harness}
    ports:
      - "127.0.0.1:${TC_LIGHTRAG_REHEARSAL_AUTHORITATIVE_PORT:-55438}:5432"
    volumes:
      - authoritative-data:/var/lib/postgresql/data
      - ./init-authoritative.sql:/docker-entrypoint-initdb.d/001-authoritative.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    labels:
      com.tc.rehearsal: tc-lightrag-failover-rehearsal
      com.tc.role: authoritative-postgres
    networks:
      - rehearsal

  lightrag-postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres-age-pgvector
    image: tc-lightrag-failover-postgres:pg16-age1.6.0-vector0.8.1
    container_name: tc-lightrag-failover-aux-postgres
    environment:
      POSTGRES_DB: tc_lightrag_auxiliary_test
      POSTGRES_USER: tc_lightrag_rehearsal
      POSTGRES_PASSWORD: ${TC_LIGHTRAG_REHEARSAL_AUXILIARY_PASSWORD:?generated by the rehearsal harness}
    ports:
      - "127.0.0.1:${TC_LIGHTRAG_REHEARSAL_AUXILIARY_PORT:-55439}:5432"
    volumes:
      - lightrag-data:/var/lib/postgresql/data
      - ./init-lightrag.sql:/docker-entrypoint-initdb.d/001-lightrag.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    stop_grace_period: 1s
    labels:
      com.tc.rehearsal: tc-lightrag-failover-rehearsal
      com.tc.role: lightrag-postgres
    networks:
      - rehearsal

volumes:
  authoritative-data:
    name: tc-lightrag-failover-authoritative-data
    labels:
      com.tc.rehearsal: tc-lightrag-failover-rehearsal
  lightrag-data:
    name: tc-lightrag-failover-aux-data
    labels:
      com.tc.rehearsal: tc-lightrag-failover-rehearsal

networks:
  rehearsal:
    name: tc-lightrag-failover-network
    labels:
      com.tc.rehearsal: tc-lightrag-failover-rehearsal
