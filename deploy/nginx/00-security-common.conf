# Load this file in nginx's `http` context before the listener files.
# Query strings, request bodies, cookies, authorization values, and Slack
# signature headers are deliberately absent from this access log format.
server_tokens off;

log_format tc_redacted escape=json
    '{"time":"$time_iso8601",'
    '"trace_id":"edge_$request_id",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"status":$status,'
    '"request_bytes":$request_length,'
    '"response_bytes":$bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time"}';

# These zones are intentionally shared only by the exact public Slack route.
limit_req_zone $binary_remote_addr zone=tc_slack_events_per_ip:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=tc_slack_events_connections:10m;

map $http_content_type $tc_slack_json_content_type {
    default 0;
    "~*^application/json(?:\s*;.*)?$" 1;
}

# With an empty trusted-proxies file nginx ignores inbound forwarding headers
# and uses the direct peer address. Add only load-balancer/reverse-proxy CIDRs;
# never add 0.0.0.0/0, ::/0, or a blanket RFC1918 range.
real_ip_header X-Forwarded-For;
real_ip_recursive on;
include /etc/nginx/tc/trusted-proxies.conf;
