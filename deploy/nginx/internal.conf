# Load after 00-security-common.conf. Host/LB firewall binding is still required,
# but the source ACL below is an independent fail-closed guard for every route.
upstream tc_web {
    server web:3000;
    keepalive 16;
}

upstream tc_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    include /etc/nginx/tc/internal-allowlist.conf;
    include /etc/nginx/tc/internal-security-headers.conf;

    access_log /var/log/nginx/tc-internal-access.log tc_redacted;
    error_log /var/log/nginx/tc-internal-error.log warn;

    client_max_body_size 25m;
    client_body_timeout 30s;
    keepalive_timeout 15s;
    send_timeout 60s;

    # Slack HTTP ingress has exactly one owner: the public listener. Keeping it
    # out of the UI fallback prevents accidental dual exposure during rollout.
    location = /integrations/slack/events {
        return 404;
    }

    location = /health {
        proxy_pass http://tc_api/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Trace-Id edge_$request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
    }

    location /api/ {
        proxy_pass http://tc_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Trace-Id edge_$request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
    }

    location / {
        proxy_pass http://tc_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Trace-Id edge_$request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
    }
}
