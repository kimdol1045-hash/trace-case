# Load after 00-security-common.conf and publish only when TC_SLACK_MODE=http.
# TLS terminates at the trusted edge/LB; that layer must not rewrite the body.
upstream tc_slack_api {
    server api:8000;
    keepalive 8;
}

server {
    listen 8081 default_server;
    listen [::]:8081 default_server;
    server_name _;

    access_log /var/log/nginx/tc-slack-access.log tc_redacted;
    error_log /var/log/nginx/tc-slack-error.log warn;

    client_max_body_size 256k;
    client_body_buffer_size 256k;
    client_body_timeout 5s;
    keepalive_timeout 5s;
    send_timeout 5s;

    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /integrations/slack/events {
        if ($request_method != POST) { return 405; }
        if ($is_args != "") { return 400; }
        if ($tc_slack_json_content_type = 0) { return 415; }
        limit_except POST { deny all; }

        limit_req zone=tc_slack_events_per_ip burst=30 nodelay;
        limit_req_status 429;
        limit_conn tc_slack_events_connections 10;

        # Buffering enforces the size/time bound before upstream delivery. It
        # does not parse or transform the entity body, so FastAPI still verifies
        # Slack's signature against the exact bytes received from nginx.
        proxy_pass http://tc_slack_api;
        proxy_http_version 1.1;
        proxy_pass_request_body on;
        proxy_pass_request_headers on;
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Trace-Id edge_$request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_send_timeout 3s;
        proxy_next_upstream off;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
    }

    location / {
        return 404;
    }
}
