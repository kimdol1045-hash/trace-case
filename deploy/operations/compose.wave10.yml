name: ${TC_PHASE_F_T11_WAVE10_PROJECT:?generated by the Wave 10 harness}

services:
  postgres:
    image: ${TC_PHASE_F_T11_WAVE10_POSTGRES_IMAGE:?pre-existing PostgreSQL 16 image ID}
    pull_policy: never
    container_name: ${TC_PHASE_F_T11_WAVE10_POSTGRES_CONTAINER:?generated by the Wave 10 harness}
    environment:
      POSTGRES_DB: ${TC_PHASE_F_T11_WAVE10_DATABASE:?generated by the Wave 10 harness}
      POSTGRES_USER: ${TC_PHASE_F_T11_WAVE10_USER:?generated by the Wave 10 harness}
      POSTGRES_PASSWORD: ${TC_PHASE_F_T11_WAVE10_PASSWORD:?generated by the Wave 10 harness}
    ports:
      - "127.0.0.1:${TC_PHASE_F_T11_WAVE10_POSTGRES_PORT:?generated by the Wave 10 harness}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 2s
      retries: 45
      start_period: 5s
    stop_grace_period: 1s
    labels:
      com.tc.phase-f-rehearsal: ${TC_PHASE_F_T11_WAVE10_PROJECT}
      com.tc.phase-f-task: PF-SF1-T11
      com.tc.phase-f-wave: wave10
      com.tc.role: browser-uat-postgres
    networks: [rehearsal]

  minio:
    image: ${TC_PHASE_F_T11_WAVE10_MINIO_IMAGE:?pre-existing MinIO image ID}
    pull_policy: never
    container_name: ${TC_PHASE_F_T11_WAVE10_MINIO_CONTAINER:?generated by the Wave 10 harness}
    command: server /data
    environment:
      MINIO_ROOT_USER: ${TC_PHASE_F_T11_WAVE10_ACCESS_KEY:?generated by the Wave 10 harness}
      MINIO_ROOT_PASSWORD: ${TC_PHASE_F_T11_WAVE10_SECRET_KEY:?generated by the Wave 10 harness}
      MINIO_API_CORS_ALLOW_ORIGIN: http://127.0.0.1:${TC_PHASE_F_T11_WAVE10_WEB_PORT:?generated by the Wave 10 harness}
    ports:
      - "127.0.0.1:${TC_PHASE_F_T11_WAVE10_MINIO_PORT:?generated by the Wave 10 harness}:9000"
    volumes:
      - object-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 45
      start_period: 5s
    stop_grace_period: 1s
    labels:
      com.tc.phase-f-rehearsal: ${TC_PHASE_F_T11_WAVE10_PROJECT}
      com.tc.phase-f-task: PF-SF1-T11
      com.tc.phase-f-wave: wave10
      com.tc.role: browser-uat-object-storage
    networks: [rehearsal]

  clamav:
    image: ${TC_PHASE_F_T11_WAVE10_CLAMAV_IMAGE:?pre-existing ClamAV image ID}
    pull_policy: never
    container_name: ${TC_PHASE_F_T11_WAVE10_CLAMAV_CONTAINER:?generated by the Wave 10 harness}
    ports:
      - "127.0.0.1:${TC_PHASE_F_T11_WAVE10_CLAMAV_PORT:?generated by the Wave 10 harness}:3310"
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 48
      start_period: 30s
    stop_grace_period: 1s
    labels:
      com.tc.phase-f-rehearsal: ${TC_PHASE_F_T11_WAVE10_PROJECT}
      com.tc.phase-f-task: PF-SF1-T11
      com.tc.phase-f-wave: wave10
      com.tc.role: browser-uat-malware-scan
    networks: [rehearsal]

  minio-init:
    image: ${TC_PHASE_F_T11_WAVE10_MC_IMAGE:?pre-existing MinIO client image ID}
    pull_policy: never
    container_name: ${TC_PHASE_F_T11_WAVE10_MC_CONTAINER:?generated by the Wave 10 harness}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${TC_PHASE_F_T11_WAVE10_ACCESS_KEY:?generated by the Wave 10 harness}
      MINIO_ROOT_PASSWORD: ${TC_PHASE_F_T11_WAVE10_SECRET_KEY:?generated by the Wave 10 harness}
      MINIO_BUCKET: ${TC_PHASE_F_T11_WAVE10_BUCKET:?generated by the Wave 10 harness}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set wave10 http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null
        mc mb "wave10/$${MINIO_BUCKET}" >/dev/null
        mc anonymous set none "wave10/$${MINIO_BUCKET}" >/dev/null
    restart: "no"
    labels:
      com.tc.phase-f-rehearsal: ${TC_PHASE_F_T11_WAVE10_PROJECT}
      com.tc.phase-f-task: PF-SF1-T11
      com.tc.phase-f-wave: wave10
      com.tc.role: browser-uat-bucket-init
    networks: [rehearsal]

volumes:
  postgres-data:
    name: ${TC_PHASE_F_T11_WAVE10_POSTGRES_VOLUME:?generated by the Wave 10 harness}
    labels:
      com.tc.phase-f-rehearsal: ${TC_PHASE_F_T11_WAVE10_PROJECT}
      com.tc.phase-f-task: PF-SF1-T11
      com.tc.phase-f-wave: wave10
  object-data:
    name: ${TC_PHASE_F_T11_WAVE10_OBJECT_VOLUME:?generated by the Wave 10 harness}
    labels:
      com.tc.phase-f-rehearsal: ${TC_PHASE_F_T11_WAVE10_PROJECT}
      com.tc.phase-f-task: PF-SF1-T11
      com.tc.phase-f-wave: wave10

networks:
  rehearsal:
    name: ${TC_PHASE_F_T11_WAVE10_NETWORK:?generated by the Wave 10 harness}
    labels:
      com.tc.phase-f-rehearsal: ${TC_PHASE_F_T11_WAVE10_PROJECT}
      com.tc.phase-f-task: PF-SF1-T11
      com.tc.phase-f-wave: wave10
