name: ${TC_PHASE_F_T10_WAVE9_PROJECT:?generated by the wave-9 harness}

services:
  postgres:
    image: ${TC_PHASE_F_T10_WAVE9_IMAGE_ID:?pre-existing pinned pgvector PostgreSQL 16 image id}
    container_name: ${TC_PHASE_F_T10_WAVE9_CONTAINER:?generated by the wave-9 harness}
    environment:
      POSTGRES_DB: ${TC_PHASE_F_T10_WAVE9_DATABASE:?generated by the wave-9 harness}
      POSTGRES_USER: ${TC_PHASE_F_T10_WAVE9_USER:?generated by the wave-9 harness}
      POSTGRES_PASSWORD: ${TC_PHASE_F_T10_WAVE9_PASSWORD:?generated by the wave-9 harness}
    ports:
      - "127.0.0.1:${TC_PHASE_F_T10_WAVE9_PORT:?generated by the wave-9 harness}:5432"
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 2s
      retries: 45
      start_period: 5s
    stop_grace_period: 1s
    labels:
      com.tc.phase-f-rehearsal: ${TC_PHASE_F_T10_WAVE9_PROJECT}
      com.tc.phase-f-task: PF-SF1-T10
      com.tc.phase-f-wave: wave9
      com.tc.role: migration-postgres
    networks:
      - rehearsal

volumes:
  database-data:
    name: ${TC_PHASE_F_T10_WAVE9_VOLUME:?generated by the wave-9 harness}
    labels:
      com.tc.phase-f-rehearsal: ${TC_PHASE_F_T10_WAVE9_PROJECT}
      com.tc.phase-f-task: PF-SF1-T10
      com.tc.phase-f-wave: wave9

networks:
  rehearsal:
    name: ${TC_PHASE_F_T10_WAVE9_NETWORK:?generated by the wave-9 harness}
    labels:
      com.tc.phase-f-rehearsal: ${TC_PHASE_F_T10_WAVE9_PROJECT}
      com.tc.phase-f-task: PF-SF1-T10
      com.tc.phase-f-wave: wave9
