[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tc-worker"
version = "0.1.0"
description = "PostgreSQL queue worker entrypoint for the TC platform"
requires-python = ">=3.12"
dependencies = ["tc-backend==0.1.0"]

[project.scripts]
tc-worker = "tc_worker.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

